<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TBH Pixel Auto Battler - Full Canvas Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #121317;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            max-width: 600px;
            width: 100%;
        }

        #game-container {
            border: 3px solid #2c3e50;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            background-color: #000;
        }

        /* Dashboard & Control Panel */
        .control-panel {
            background: #1e222d;
            border: 1px solid #333a4d;
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #f1c40f;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #333a4d;
            padding-bottom: 6px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            background: #2b3245;
            color: #fff;
            border: 1px solid #45506b;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #3a445d;
            border-color: #f1c40f;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Inventory Box */
        .inventory-box {
            background: #141721;
            border: 1px dashed #45506b;
            border-radius: 6px;
            padding: 10px;
            min-height: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
        }

        .item-slot {
            min-width: 36px;
            height: 36px;
            background: #222736;
            border: 1px solid #f1c40f;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>

    <div class="main-wrapper">
        <!-- Canvas Game Window -->
        <div id="game-container"></div>

        <!-- HTML Test Control Panel -->
        <div class="control-panel">
            <div class="panel-title">⚙️ Bridge Control Panel (ทดสอบส่งคำสั่งเข้า Canvas)</div>
            
            <div class="btn-group">
                <button onclick="changePetSkin('dragon')">🐉 เปลี่ยนสัตว์เลี้ยง: มังกร</button>
                <button onclick="changePetSkin('phoenix')">🦅 เปลี่ยนสัตว์เลี้ยง: ฟินิกซ์</button>
                <button onclick="changePetSkin('slime')">💧 เปลี่ยนสัตว์เลี้ยง: สไลม์</button>
            </div>

            <div class="btn-group">
                <button onclick="triggerHeroSkill('ultimate')">⚡ ร่ายท่าไม้ตาย (Ultimate Beam)</button>
                <button onclick="forceSpawnBoss()">👹 เรียกบอสออกมาทันที</button>
            </div>

            <div class="btn-group">
                <button onclick="changeMapTheme('forest')">🌲 ฉาก: ป่าไม้</button>
                <button onclick="changeMapTheme('dungeon')">🏰 ฉาก: ดันเจี้ยน</button>
                <button onclick="changeMapTheme('lava')">🌋 ฉาก: ถ้ำลาวา</button>
            </div>

            <div class="panel-title" style="margin-top: 5px;">🎒 กระเป๋าเก็บไอเทมที่ฟาร์มได้ (Loot Preview)</div>
            <div class="inventory-box" id="inventory-list">
                <span style="font-size: 11px; color: #888;" id="empty-text">ยังไม่มีไอเทมดรอป...</span>
            </div>
        </div>
    </div>

    <!-- ลิงก์ไปยังไฟล์ game.js ของคุณ -->
    <script src="game.js?v=2"></script>
    
    <script>
        // รับ Event จาก Canvas มาแสดงผลไอเทมดรอปใน HTML Inventory Panel
        window.addEventListener('message', function(e) {
            // รองรับทั้งการเรียกผ่าน window.postMessage และ FlutterChannel
        });

        // ฟังก์ชันสำหรับเพิ่มไอคอนไอเทมลงในกล่องกระเป๋าจำลอง
        function addLootToInventoryUI(iconSymbol, name) {
            const container = document.getElementById('inventory-list');
            const emptyText = document.getElementById('empty-text');
            if (emptyText) emptyText.style.display = 'none';

            const slot = document.createElement('div');
            slot.className = 'item-slot';
            slot.title = name;
            slot.innerText = iconSymbol;
            container.appendChild(slot);
        }
    </script>
</body>
</html>
